name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "runtime/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "runtime/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/app/.cxx
          key: native-${{ runner.os }}-${{ hashFiles('android/native/CMakeLists.txt', 'runtime/**/*.c', 'runtime/**/*.h') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Build (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build (release, debug-signed)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/AVGN8bit-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/AVGN8bit-release.apk
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AVGN8bit-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APKs to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            android/**/build/outputs/logs/**
            android/**/.cxx/**/*.log
          if-no-files-found: ignore
          retention-days: 7
