name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "runtime/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "runtime/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      game_zip_url:
        description: >-
          Прямая ссылка на zip с файлами игры (data.win + шрифты + Lang/Attract/Cutscenes).
          Оставьте пустым, чтобы собрать обычный APK без игры.
        required: false
        type: string
      include_videos:
        description: "Включить катсцены в APK (сильно увеличивает размер)"
        required: false
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write

env:
  GAME_ZIP_URL: ${{ github.event.inputs.game_zip_url }}
  INCLUDE_VIDEOS: ${{ github.event.inputs.include_videos }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The runner image ships the Android SDK, but not always the exact NDK/CMake/platform the project pins, and
      # occasionally no SDK at all. Both cases are handled here without third-party setup actions.
      - name: Android SDK, NDK and CMake
        run: |
          set -uo pipefail

          annotate() {
            tail -n 15 "$1" 2>/dev/null | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              echo "::error title=$2::${line}"
            done
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK="$HOME/android-sdk"; fi
          mkdir -p "$SDK/cmdline-tools"

          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "cmdline-tools not found in $SDK, downloading them"
            if ! curl -fsSL --retry 3 -o /tmp/cmdline-tools.zip \
                https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip 2>/tmp/curl.log; then
              annotate /tmp/curl.log "cmdline-tools download"
              exit 1
            fi
            rm -rf "$SDK/cmdline-tools/latest" "$SDK/cmdline-tools/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          attempt=1
          while :; do
            if sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
                 "ndk;27.0.12077973" "cmake;3.22.1" > /tmp/sdk-install.log 2>&1; then
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              annotate /tmp/sdk-install.log "sdkmanager"
              exit 1
            fi
            echo "sdkmanager attempt $attempt failed, retrying"
            attempt=$((attempt + 1))
            sleep 15
          done

          echo "SDK: $SDK"
          sdkmanager --list_installed 2>/dev/null | sed -n '1,30p'

      - name: Cache NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.0.12077973
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: sdk-ndk-27.0.12077973-cmake-3.22.1

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/app/.cxx
          key: native-${{ runner.os }}-${{ hashFiles('android/native/CMakeLists.txt', 'runtime/**/*.c', 'runtime/**/*.h') }}
          restore-keys: |
            native-${{ runner.os }}-

      # The game archive is never committed to the repository: it is downloaded here, used for this build only and
      # thrown away with the runner. See android/README.md for how to host it.
      - name: Download the game archive
        if: env.GAME_ZIP_URL != ''
        run: |
          curl -L --fail --retry 3 --retry-delay 5 -o game.zip "$GAME_ZIP_URL"
          ls -lh game.zip
          echo "--- contents (first 25 entries) ---"
          unzip -l game.zip | head -30 || true

      - name: Prepare bundled game
        id: bundle
        run: |
          # Three ways to bring the game in: the workflow input (downloaded above), a zip committed to the checkout
          # (only makes sense in a private fork, see android/README.md), or nothing at all.
          zip=""
          if [ -f game.zip ]; then
            zip="$PWD/game.zip"
          elif [ -f android/game.zip ]; then
            zip="$PWD/android/game.zip"
          fi
          args=""
          if [ -n "$zip" ]; then
            args="-PbundleGame=$zip"
            if [ "$INCLUDE_VIDEOS" = "true" ]; then
              args="$args -PbundleVideos=true"
            fi
            echo "bundled=true" >> "$GITHUB_OUTPUT"
          else
            echo "bundled=false" >> "$GITHUB_OUTPUT"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "Bundle args: $args"

      - name: Build (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug ${{ steps.bundle.outputs.args }} 2>&1 | tee build-debug.log

      - name: Build (release, debug-signed)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease ${{ steps.bundle.outputs.args }} 2>&1 | tee build-release.log

      # The build logs are behind a host that some sandboxes cannot reach, so the interesting lines are republished
      # as check-run annotations (visible from the API and in the PR/files tab).
      - name: Publish build errors as annotations
        if: failure()
        run: |
          log=$(ls android/build-*.log 2>/dev/null | head -1)
          if [ -z "$log" ]; then echo "No build log found"; exit 0; fi
          grep -aE "^(e: |w: .*\.kt)|error:|CMake Error|Execution failed for task|What went wrong|Caused by:|Unresolved reference|^\.\.\. " "$log" \
            | grep -av "warning:" | awk '!seen[$0]++' | head -25 | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\n'/'%0A'}
              line=${line//$'\r'/''}
              echo "::error title=build::$line"
            done

      - name: Collect APKs
        env:
          BUNDLED: ${{ steps.bundle.outputs.bundled }}
          VIDEOS: ${{ env.INCLUDE_VIDEOS }}
        run: |
          mkdir -p artifacts
          suffix=""
          if [ "$BUNDLED" = "true" ]; then
            suffix="-bundled"
            if [ "$VIDEOS" = "true" ]; then suffix="-bundled-videos"; fi
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/AVGN8bit-debug${suffix}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/AVGN8bit-release${suffix}.apk"
          ls -lh artifacts
          du -sh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AVGN8bit-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APKs to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            android/**/build/outputs/logs/**
            android/**/.cxx/**/*.log
          if-no-files-found: ignore
          retention-days: 7
